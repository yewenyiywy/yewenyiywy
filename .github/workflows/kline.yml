name: Update $WENYI chart

on:
  schedule:
    - cron: "23 7 * * *"     # 每天 UTC 07:23（太平洋时间夜里）更新一次
  workflow_dispatch:          # 也可以在 Actions 页面手动运行
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate K-line SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/kline.py --user ${{ github.repository_owner }} --out dist
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
