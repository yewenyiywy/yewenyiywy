name: Update $WENYI chart

on:
  schedule:
    - cron: "23 7 * * *"     # 每天 UTC 07:23（太平洋时间夜里）更新一次
  workflow_dispatch:          # 也可以在 Actions 页面手动运行
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: kline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate K-line SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/kline.py --user ${{ github.repository_owner }} --out dist
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GitHub 的图片代理 (camo) 会按 URL 缓存图片，URL 不变就一直显示旧图。
      # 每次运行都把 README 里的 ?v= 改成新的时间戳，强制 GitHub 重新抓取最新的 SVG。
      # 这个每天的提交也让仓库保持"活跃"，避免定时任务在 60 天无活动后被 GitHub 自动停用。
      # 提交者是 github-actions[bot]，不会计入你自己的贡献数，所以不影响 K 线数据。
      - name: Bust GitHub image cache in README
        run: |
          stamp=$(date -u +%Y%m%d%H%M)
          sed -i -E "s#(kline(-dark)?\.svg)\?v=[A-Za-z0-9_-]*#\1?v=${stamp}#g" README.md
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh \$WENYI chart (${stamp})"
          git pull --rebase origin main
          git push origin HEAD:main
